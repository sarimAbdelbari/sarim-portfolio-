<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0f172a"/>
  <rect width="1280" height="720" fill="url(#grid2)" opacity="0.12"/>

  <defs>
    <pattern id="grid2" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Background glows -->
  <circle cx="400" cy="360" r="200" fill="#0d9488" opacity="0.07" filter="url(#blur2)"/>
  <circle cx="900" cy="300" r="160" fill="#7c3aed" opacity="0.07" filter="url(#blur2)"/>

  <!-- Bar chart icon -->
  <g transform="translate(578, 220)">
    <!-- Bars -->
    <rect x="0" y="60" width="22" height="80" rx="3" fill="#0d9488" opacity="0.7"/>
    <rect x="30" y="30" width="22" height="110" rx="3" fill="#0d9488" opacity="0.85"/>
    <rect x="60" y="10" width="22" height="130" rx="3" fill="#0d9488"/>
    <rect x="90" y="50" width="22" height="90" rx="3" fill="#0d9488" opacity="0.75"/>
    <!-- Baseline -->
    <line x1="-5" y1="140" x2="125" y2="140" stroke="#334155" stroke-width="2"/>
    <!-- Trend line -->
    <polyline points="11,100 41,70 71,40 101,80" fill="none" stroke="#f8fafc" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>
  </g>

  <!-- Label -->
  <text x="640" y="432" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="2">GPAO PRODUCTION SYSTEM</text>
  <text x="640" y="465" font-family="system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle" letter-spacing="1">CONFIDENTIAL � NDA PROTECTED</text>

  <!-- Decorative lines -->
  <line x1="420" y1="490" x2="560" y2="490" stroke="#1e293b" stroke-width="1"/>
  <circle cx="640" cy="490" r="3" fill="#0d9488"/>
  <line x1="720" y1="490" x2="860" y2="490" stroke="#1e293b" stroke-width="1"/>
</svg>
